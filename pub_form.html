<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selector de Publicaciones</title>
  <style>
    :root {
      --primary-color: #a4b494;
      --primary-hover: #8f9f7f;
      --bg-color: #171810;
      --card-bg: #222417;
      --text-color: #e3e4db;
      --text-muted: #a3a49b;
      --border-color: #333622;
      --accent: #d2a450;
      --input-bg: #1c1d12;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem 1rem;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: var(--primary-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.75rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    label.section-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"] {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
    }

    .search-box {
      margin-bottom: 1rem;
    }

    .checkbox-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      border-radius: 6px;
      padding: 1rem;
    }

    .year-group h3 {
      font-size: 1rem;
      margin: 0.75rem 0 0.5rem 0;
      color: var(--accent);
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.25rem;
    }

    .pub-checkbox-label {
      display: flex;
      align-items: flex-start;
      margin-bottom: 0.65rem;
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-color);
    }

    .pub-checkbox-label input[type="checkbox"] {
      margin-right: 0.75rem;
      margin-top: 0.15rem;
      accent-color: var(--primary-color);
    }

    .pub-checkbox-label:hover {
      color: var(--primary-color);
    }

    .btn-submit {
      background-color: var(--primary-color);
      color: var(--bg-color);
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 1rem;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Scrollbar styling */
    .checkbox-container::-webkit-scrollbar {
      width: 6px;
    }
    .checkbox-container::-webkit-scrollbar-track {
      background: var(--input-bg);
    }
    .checkbox-container::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    .checkbox-container::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>

  <script>
    // Filtro dinámico en tiempo real
    function filterPublications() {
      const query = document.getElementById('pub-search').value.toLowerCase();
      const labels = document.querySelectorAll('.pub-checkbox-label');
      const groups = document.querySelectorAll('.year-group');

      groups.forEach(group => {
        let hasVisibleLabel = false;
        const groupLabels = group.querySelectorAll('.pub-checkbox-label');
        
        groupLabels.forEach(label => {
          const text = label.querySelector('.checkbox-text').textContent.toLowerCase();
          if (text.includes(query)) {
            label.style.display = 'flex';
            hasVisibleLabel = true;
          } else {
            label.style.display = 'none';
          }
        });

        // Ocultar el grupo del año si no contiene publicaciones coincidentes
        const heading = group.querySelector('h3');
        if (hasVisibleLabel) {
          group.style.display = 'block';
          if (heading) heading.style.display = 'block';
        } else {
          group.style.display = 'none';
          if (heading) heading.style.display = 'none';
        }
      });
    }

    // Manejador del envío del formulario (ejemplo)
    function handleSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const data = new FormData(form);
      
      const singlePub = data.get('single_publication');
      const multiplePubs = data.getAll('selected_publications');
      
      console.log('Publicación Única Seleccionada:', singlePub);
      console.log('Publicaciones Múltiples Seleccionadas:', multiplePubs);
      
      alert(
        '¡Formulario enviado!\n\n' +
        'Dropdown: ' + (singlePub || 'Ninguna') + '\n' +
        'Seleccionadas en Checklist: ' + multiplePubs.length + ' publicaciones.'
      );
    }
